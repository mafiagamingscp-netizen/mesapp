<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<title>LastVix Admin</title>
<style>:root{--bg:#0F172A;--c:#1e293b;--t:#f1f5f9;--g:#d97706;--r:#dc2626;--ok:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
.w{max-width:900px;margin:auto;padding:12px}.card{background:var(--c);border-radius:12px;padding:12px;margin:10px 0}input,select,textarea{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #475569;background:#0b1220;color:var(--t)}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;margin:2px}button.r{background:var(--r)}button.o{background:var(--ok)}
.tabs{display:flex;gap:4px;overflow:auto;position:sticky;top:0;background:var(--bg);padding:6px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #334155;padding:8px 0}.s{font-size:12px;opacity:.7}.hide{display:none}#net{position:fixed;bottom:8px;left:8px;padding:4px 10px;border-radius:99px;font-size:12px}</style></head><body><div class="w">
<div id="login" class="card"><h2>🔐 دخول الأدمن</h2><input id="em" type="email" placeholder="اسم المستخدم (AD123) أو الإيميل" autocomplete="username"><input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password"><button onclick="signIn()">دخول</button><div id="err" class="s"></div></div>
<div id="app" class="hide"><div class="tabs" id="tabs"></div><div id="view"></div><button class="r" onclick="fb.auth().signOut()">خروج</button></div></div><div id="net"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
var PRIV=null,fb=window.firebase,$=function(i){return document.getElementById(i)},LS=localStorage,db,TAB='req',D={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lvxB64(u){u=new Uint8Array(u);var s='',i;for(i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function lvxUb(s){var b=atob(s),u=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function lvxEnc(text,PUB){var S=crypto.subtle,k=await S.generateKey({name:'AES-GCM',length:256},true,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await S.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(text)),raw=await S.exportKey('raw',k),pk=await S.importKey('jwk',PUB,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']),wk=await S.encrypt({name:'RSA-OAEP'},pk,raw);return{v:2,iv:lvxB64(iv),k:lvxB64(wk),ct:lvxB64(ct)}}
async function lvxDec(o,PRIV){var S=crypto.subtle,pk=await S.importKey('jwk',PRIV,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']),raw=await S.decrypt({name:'RSA-OAEP'},pk,lvxUb(o.k)),k=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']),pt=await S.decrypt({name:'AES-GCM',iv:lvxUb(o.iv)},k,lvxUb(o.ct));return new TextDecoder().decode(pt)}

function loadKey(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{PRIV=JSON.parse(r.result);alert('تم تحميل المفتاح (في الذاكرة فقط)')}catch(e){alert('ملف المفتاح غير صالح')}};r.readAsText(f)}
function licKey(e){return String(e||'').toLowerCase().replace(/[.#$\[\]\/]/g,',')}
function num(v){v=parseFloat(v);return isFinite(v)?v:0}
/* firebase init (offline-safe: if SDK not loaded, cached data still shows) */
try{fb.initializeApp({apiKey:"AIzaSyDiXfWn8EAke6rfp4S-tP-JPrEgv5ivBkA",authDomain:"communication-ebba7.firebaseapp.com",databaseURL:"https://communication-ebba7-default-rtdb.firebaseio.com",projectId:"communication-ebba7",storageBucket:"communication-ebba7.firebasestorage.app",messagingSenderId:"41372617613",appId:"1:41372617613:web:ac3b95e52e9bffa2d98bc4"});db=fb.database()}catch(e){$('err').textContent='لا يوجد اتصال بخدمة Firebase حاليًا (وضع أوفلاين)'}
function net(){var n=$('net');n.textContent=navigator.onLine?'🟢 أونلاين':'🟠 أوفلاين (بيانات محفوظة)';n.style.background=navigator.onLine?'#14532d':'#7c2d12'}addEventListener('online',net);addEventListener('offline',net);net();
function signIn(){fb.auth().signInWithEmailAndPassword((function(e){e=e.trim();return e.indexOf('@')<0?e.toLowerCase()+'@lastvix.app':e})($('em').value),$('pw').value).catch(function(){$('err').textContent='بيانات الدخول غير صحيحة'})}
var PATHS={req:'payRequests',cfg:'config/platform',gyms:'devices',lic:'licenses',bm:'backupMeta',bans:'bans/devices',notes:'notices'};
if(fb.auth)fb.auth().onAuthStateChanged(function(u){if(!u){$('login').classList.remove('hide');$('app').classList.add('hide');return}
/* only real admins (admins/<uid>=true) get the panel; rules enforce this server-side too */
db.ref('admins/'+u.uid).once('value').then(function(s){if(s.val()!==true){fb.auth().signOut();$('err').textContent='هذا الحساب ليس أدمن';return}$('login').classList.add('hide');$('app').classList.remove('hide');start()}).catch(function(){$('err').textContent='تعذر التحقق'})});
function start(){Object.keys(PATHS).forEach(function(k){D[k]=JSON.parse(LS.getItem('adm_'+k)||'null');db.ref(PATHS[k]).on('value',function(s){D[k]=s.val();LS.setItem('adm_'+k,JSON.stringify(D[k]));render()})});render()}
var TABS={req:'💳 الطلبات',cfg:'⚙️ الدفع والأسعار',gyms:'🏋️ الجيمات',notes:'🔔 إشعارات',bk:'💾 نسخ احتياطية'};
function render(){$('tabs').innerHTML=Object.keys(TABS).map(function(k){return'<button onclick="TAB=\''+k+'\';render()" style="opacity:'+(k==TAB?1:.6)+'">'+TABS[k]+'</button>'}).join('');$('view').innerHTML=V[TAB]()}
var V={
req:function(){var r=D.req||{},h='<div class="card"><h3>طلبات الاشتراك والتجديد</h3>';Object.keys(r).sort(function(a,b){return(r[b].at||0)-(r[a].at||0)}).forEach(function(id){var q=r[id];h+='<div class="row"><div><b>'+esc(q.gymName||q.tenant)+'</b> — '+esc(q.type||'اشتراك')+' '+esc(q.months)+' شهر<div class="s">'+esc(q.method)+' • '+esc(q.amount)+' • '+esc(q.phone||'')+' • '+esc(q.ref||'')+'</div><div class="s">الحالة: '+esc(q.status||'جديد')+'</div></div><div>'+(q.status==='approved'?'':'<button class="o" onclick="decide(\''+esc(id)+'\',true)">قبول</button><button class="r" onclick="decide(\''+esc(id)+'\',false)">رفض</button>')+'</div></div>'});return h+(Object.keys(r).length?'':'<p class="s">لا توجد طلبات</p>')+'</div>'},
cfg:function(){var c=D.cfg||{},p=c.prices||{};return'<div class="card"><h3>إعدادات الدفع</h3><label>رقم محفظة الاشتراك</label><input id="c_w" value="'+esc(c.wallet)+'"><label>وسائل الدفع (افصل بفاصلة)</label><input id="c_m" value="'+esc((c.methods||[]).join(','))+'"><label><input type="checkbox" id="c_dv" style="width:auto" '+(c.deviceVerify?'checked':'')+'> تفعيل التحقق من الجهاز الجديد</label><label>رقم واتساب المطور</label><input id="c_wa" value="'+esc(c.devWa)+'"><label>أيام التجربة (1 = 24 ساعة)</label><input id="c_t" type="number" value="'+esc(c.trialDays==null?1:c.trialDays)+'">'+[1,3,6,12].map(function(m){return'<label>سعر '+m+' شهر</label><input id="c_p'+m+'" type="number" value="'+esc(p[m])+'">'}).join('')+'<button onclick="saveCfg()">💾 حفظ</button></div>'},
gyms:function(){var g=D.gyms||{},b=D.bans||{},L=D.lic||{},h='<div class="card"><h3>الأجهزة والجيمات</h3>';Object.keys(g).sort(function(x,y){return(g[y].lastSeen||0)-(g[x].lastSeen||0)}).forEach(function(id){var x=g[id],l=L[licKey(x.email)]||{};h+='<div class="row"><div><b>'+esc(x.gym||x.name||x.email||id)+'</b><div class="s">'+esc(x.email)+' • '+esc(x.phone)+' • '+(x.lastSeen?new Date(x.lastSeen).toLocaleString('ar-EG'):'')+'</div><div class="s">الاشتراك حتى: '+(l.expireAt?new Date(l.expireAt).toLocaleDateString('ar-EG'):'تجربة/غير مفعّل')+'</div></div><div><button class="o" onclick="paid(\''+esc(x.email)+'\')">تفعيل</button>'+(b[id]?'<button class="o" onclick="ban(\''+esc(id)+'\',false)">فك الحظر</button>':'<button class="r" onclick="ban(\''+esc(id)+'\',true)">حظر</button>')+'</div></div>'});return h+'</div>'},
bk:function(){var m=D.bm||{},h='<div class="card"><h3>نسخ المشتركين لكل جيم</h3><p class="s">النسخ مشفّرة. حمّل مفتاحك الخاص لفكها:</p><input type="file" accept=".json" onchange="loadKey(this)">';Object.keys(m).forEach(function(k){Object.keys(m[k]).forEach(function(u){var x=m[k][u];h+='<div class="row"><div><b>'+esc(x.gym||x.email)+'</b><div class="s">'+esc(x.email)+' • '+esc(x.count)+' مشترك • '+new Date(x.at).toLocaleString('ar-EG')+'</div></div><button onclick="dl(\''+esc(k)+'\',\''+esc(u)+'\')">⬇️ تنزيل</button></div>'})});return h+'</div>'},
notes:function(){return'<div class="card"><h3>إرسال إشعار للجميع</h3><input id="n_t" placeholder="العنوان"><textarea id="n_b" rows="3" placeholder="النص"></textarea><button onclick="sendNote()">📣 إرسال</button></div>'}};
function setLic(email,months){var k='licenses/'+licKey(email);return db.ref(k).once('value').then(function(s){var c=s.val()||{},base=Math.max(Date.now(),+c.expireAt||0);return db.ref(k).update({email:String(email).toLowerCase(),status:'active',plan:'paid',expireAt:(function(){var x=new Date(base);x.setMonth(x.getMonth()+num(months));return x.getTime()})(),updatedAt:Date.now()})})}
function decide(id,ok){var q=D.req[id];db.ref('payRequests/'+id).update({status:ok?'approved':'rejected',decidedAt:fb.database.ServerValue.TIMESTAMP});if(ok&&q.email)setLic(q.email,q.months)}
function saveCfg(){var p={};[1,3,6,12].forEach(function(m){p[m]=num($('c_p'+m).value)});db.ref('config/platform').update({wallet:$('c_w').value.trim(),methods:$('c_m').value.split(',').map(function(s){return s.trim()}).filter(Boolean),devWa:$('c_wa').value.trim(),trialDays:num($('c_t').value),deviceVerify:$('c_dv').checked,prices:p}).then(function(){alert('تم الحفظ')})}
function paid(email){var m=prompt('عدد أشهر التفعيل','1');if(m&&email)setLic(email,m).then(function(){alert('تم')})}
function ban(id,on){if(!confirm(on?'حظر؟':'فك الحظر؟'))return;db.ref('bans/devices/'+id).set(on?{reason:'حظر من الأدمن',at:Date.now()}:null)}
function dl(k,u){db.ref('backups/'+k+'/'+u).once('value').then(function(s){var v=s.val();if(!v)return alert('لا توجد نسخة');var o;try{o=JSON.parse(v.data)}catch(e){return alert('نسخة غير صالحة')}if(!PRIV)return alert('حمّل مفتاحك الخاص أولًا');return lvxDec(o,PRIV).then(function(txt){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));l.download='gym-backup-'+k+'.json';l.click()})}).catch(function(){alert('فشل فك التشفير — تأكد من المفتاح')})}
function sendNote(){var t=$('n_t').value.trim(),b=$('n_b').value.trim();if(!t||!b)return;db.ref('notices').push({title:t,body:b,at:fb.database.ServerValue.TIMESTAMP}).then(function(){alert('تم الإرسال');$('n_t').value=$('n_b').value=''})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
